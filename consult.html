<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>15분 1:1 Zoom 상담 예약 · 박사장 클라쓰</title>
  <meta name="description" content="박사장 클라쓰 15분 1:1 Zoom 상담 예약. 날짜·시간과 오픈 단계 / 운영 단계를 골라주세요.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1F3A5A">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/path-c.js" defer></script>
</head>
<body data-page="consult">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="container container--wide">
      <a class="brand" href="index.html" aria-label="박사장 클라쓰 홈"><span class="brand-mark" aria-hidden="true">박</span>박사장 클라쓰</a>
    </div>
  </header>

  <main id="main" class="page">
    <div class="container container--narrow">
      <a class="back-link" href="live-done.html">← 라이브 신청 완료로</a>
      <div class="page-head">
        <h1 class="page-title">15분 1:1 Zoom 상담 예약</h1>
      </div>

      <form id="consult-form" novalidate>
        <section class="card" aria-labelledby="when-title">
          <h2 class="card-title" id="when-title">날짜·시간 선택 <span class="demo-tag">데모</span></h2>
          <div class="field" id="field-date" style="margin-top:14px">
            <span class="field-label" id="date-label">날짜</span>
            <div class="choice-grid choice-grid--date" id="date-options" role="group" aria-labelledby="date-label"></div>
            <p class="error-msg" aria-live="polite"></p>
          </div>
          <div class="field" id="field-time">
            <span class="field-label" id="time-label">시간</span>
            <div class="choice-grid" id="time-options" role="group" aria-labelledby="time-label">
              <button type="button" class="choice" aria-pressed="false" data-value="10:00">10:00</button>
              <button type="button" class="choice" aria-pressed="false" data-value="13:00">13:00</button>
              <button type="button" class="choice" aria-pressed="false" data-value="15:00">15:00</button>
              <button type="button" class="choice" aria-pressed="false" data-value="19:00">19:00</button>
            </div>
            <p class="error-msg" aria-live="polite"></p>
          </div>
        </section>

        <section class="card" aria-labelledby="target-title">
          <h2 class="card-title" id="target-title">대상 선택</h2>
          <div class="field" id="field-target" style="margin-top:14px">
            <div class="target-grid" role="radiogroup" aria-labelledby="target-title">
              <label class="target">
                <input type="radio" name="target" value="open">
                <span class="target-name">오픈 단계</span>
                <span class="target-desc">자영업이 '처음'인 사장님 (오픈 전 ~ 오픈 6개월)</span>
              </label>
              <label class="target target--operate">
                <input type="radio" name="target" value="operate">
                <span class="target-name">운영 단계</span>
                <span class="target-desc">이미 운영 중인 1인·소형 매장 사장님</span>
              </label>
            </div>
            <p class="error-msg" aria-live="polite"></p>
          </div>
        </section>

        <section class="card" aria-labelledby="who-title">
          <h2 class="card-title" id="who-title">예약자 정보</h2>
          <div class="field" style="margin-top:14px">
            <label class="field-label" for="c-name">이름</label>
            <input class="input" id="c-name" name="name" type="text" autocomplete="name" required aria-describedby="ce-name">
            <p class="error-msg" id="ce-name" aria-live="polite"></p>
          </div>
          <div class="field">
            <label class="field-label" for="c-contact">카카오톡 아이디 또는 이메일</label>
            <input class="input" id="c-contact" name="contact" type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required aria-describedby="ce-contact">
            <p class="error-msg" id="ce-contact" aria-live="polite"></p>
          </div>
          <div class="btn-row">
            <button class="btn btn--primary btn--block" type="submit">15분 상담 예약하기</button>
          </div>
          <p class="fine-print">입력하신 정보는 다음 화면 안내에만 쓰이고 저장되지 않아요 (데모)</p>
        </section>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-info"><span class="footer-brand">박사장 클라쓰</span> · <span>대표 박미경</span> · <span data-channel="kakao">카카오톡 채널 '박사장 클라쓰'(예정)</span> · <span data-channel="instagram">인스타그램 @parksajang_class(예정)</span></p>
      <p class="demo-notice">본 페이지의 결제는 프로젝트용 데모이며 실제 결제가 일어나지 않습니다.</p>
    </div>
  </footer>
</body>
</html>
