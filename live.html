<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>무료 Zoom 라이브 '박사장 오픈 Q&amp;A' 신청 · 박사장 클라쓰</title>
  <meta name="description" content="박사장 클라쓰 월 1회 무료 Zoom 라이브 '박사장 오픈 Q&amp;A'. 매월 마지막 주 평일 저녁 40~60분, 회차당 선착순 30명.">
  <meta name="theme-color" content="#1F3A5A">
  <link rel="canonical" href="https://YOUR-DOMAIN/live.html">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/path-c.js" defer></script>
</head>
<body data-page="live">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="container container--wide">
      <a class="brand" href="index.html" aria-label="박사장 클라쓰 홈"><span class="brand-mark" aria-hidden="true">박</span>박사장 클라쓰</a>
    </div>
  </header>

  <main id="main" class="page">
    <div class="container container--narrow">
      <div class="page-head">
        <span class="eyebrow">무료 Zoom 라이브</span>
        <h1 class="page-title">월 1회 '박사장 오픈 Q&amp;A'</h1>
      </div>

      <section class="card invite" aria-labelledby="live-info-title">
        <span class="badge" id="live-round">이번 회차</span>
        <h2 class="sr-only" id="live-info-title">라이브 안내</h2>
        <ul class="info-list">
          <li>매월 마지막 주 평일 저녁 40~60분</li>
          <li>회차당 선착순 30명</li>
        </ul>
      </section>

      <form class="card" id="live-form" novalidate aria-labelledby="live-form-title">
        <h2 class="card-title" id="live-form-title">라이브 신청</h2>
        <div class="field" style="margin-top:14px">
          <label class="field-label" for="l-name">이름</label>
          <input class="input" id="l-name" name="name" type="text" autocomplete="name" required aria-describedby="le-name">
          <p class="error-msg" id="le-name" aria-live="polite"></p>
        </div>
        <div class="field">
          <label class="field-label" for="l-contact">카카오톡 아이디 또는 이메일</label>
          <input class="input" id="l-contact" name="contact" type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required aria-describedby="le-contact">
          <p class="error-msg" id="le-contact" aria-live="polite"></p>
        </div>
        <label class="check">
          <input type="checkbox" name="marketing" value="yes">
          <span>마케팅 수신 동의 <small>(선택)</small></span>
        </label>
        <p class="reassure">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          광고 폭탄 없음 · 언제든 수신 거부
        </p>
        <div class="btn-row">
          <button class="btn btn--primary btn--block" type="submit">무료 라이브 신청하기</button>
        </div>
        <p class="fine-print">입력하신 정보는 다음 화면 안내에만 쓰이고 저장되지 않아요 (데모)</p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-info"><span class="footer-brand">박사장 클라쓰</span> · <span>대표 박미경</span> · <span data-channel="kakao">카카오톡 채널 '박사장 클라쓰'(예정)</span> · <span data-channel="instagram">인스타그램 @parksajang_class(예정)</span></p>
      <p class="demo-notice">본 페이지의 결제는 프로젝트용 데모이며 실제 결제가 일어나지 않습니다.</p>
    </div>
  </footer>
</body>
</html>
